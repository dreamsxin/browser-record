<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>工作台 — 浏览器实例管理</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <nav class="navbar">
    <div class="brand">Browser Record · 工作台</div>
    <button class="btn btn-ghost" onclick="refresh()">刷新</button>
  </nav>
  <div class="container">
    <div class="card">
      <div class="card-header">启动新实例</div>
      <div class="start-panel">
        <div class="toolbar">
          <input type="text" id="employeeId" placeholder="员工 ID（留空自动生成）" />
          <input type="text" id="startingUrl" placeholder="起始页（留空 about:blank）" />
          <select id="recordingMode"><option value="trace">Trace</option><option value="video">Video</option></select>
          <button class="btn btn-primary" onclick="startInstance()">启动实例</button>
        </div>
        <div id="startMsg" class="muted"></div>
      </div>
    </div>

    <div class="card" style="margin-top:24px;">
      <div class="card-header">实例列表</div>
      <div id="listBody">
        <div class="empty">加载中...</div>
      </div>
    </div>
  </div>

<script>
async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body ? { 'Content-Type': 'application/json' } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
  return data;
}

function fmtTime(ts) {
  if (!ts) return '-';
  return new Date(ts).toLocaleString();
}
function statusClass(s) {
  return (s || '').replace(/\s/g, '_');
}

async function refresh() {
  const body = document.getElementById('listBody');
  try {
    const list = await api('GET', '/api/instances');
    if (!list.length) { body.innerHTML = '<div class="empty">暂无实例，请在上方启动</div>'; return; }
    body.innerHTML = `
      <div class="table-wrap"><table>
        <thead><tr>
          <th>实例 / 员工 ID</th><th>模式</th><th>状态</th><th>录制</th>
          <th>当前分段</th><th>累计分段</th><th>启动时间</th><th>操作</th>
        </tr></thead>
        <tbody>${list.map(i => {
          const stopped = i.status === 'stopped' || i.status === 'browser_closed' || i.status === 'error';
          return `
          <tr>
            <td>${i.instanceId}</td>
            <td>${i.recordingMode === 'video' ? 'Video' : 'Trace'}</td>
            <td><span class="status-dot status-${statusClass(i.status)}"></span>${i.status || '-'}</td>
            <td>${i.recording ? '录制中' : '—'}</td>
            <td>${i.currentSegment ?? '-'}</td>
            <td>${i.totalSegments ?? 0}</td>
            <td>${fmtTime(i.startedAt)}</td>
            <td>
              ${stopped ? '' : `<button class="btn btn-danger" onclick="stopInstance('${i.instanceId}')">停止</button>`}
              <button class="btn btn-ghost" onclick="removeInstance('${i.instanceId}')">移除</button>
            </td>
          </tr>`;
        }).join('')}
        </tbody>
      </table></div>`;
  } catch (e) {
    body.innerHTML = `<div class="empty">加载失败：${e.message}</div>`;
  }
}

async function startInstance() {
  const msg = document.getElementById('startMsg');
  msg.textContent = '启动中...';
  msg.style.color = 'var(--muted)';
  try {
    const employeeId = document.getElementById('employeeId').value.trim() || undefined;
    const startingUrl = document.getElementById('startingUrl').value.trim() || undefined;
    const recordingMode = document.getElementById('recordingMode').value;
    const inst = await api('POST', '/api/instances', { employeeId, startingUrl, recordingMode });
    msg.textContent = `已启动: ${inst.instanceId} (${inst.recordingMode === 'video' ? 'Video' : 'Trace'})`;
    msg.style.color = 'var(--ok)';
    document.getElementById('employeeId').value = '';
    document.getElementById('startingUrl').value = '';
    refresh();
  } catch (e) {
    msg.textContent = '启动失败：' + e.message;
    msg.style.color = 'var(--danger)';
  }
}

async function stopInstance(id) {
  if (!confirm(`确认停止实例 ${id}？`)) return;
  try { await api('POST', `/api/instances/${encodeURIComponent(id)}/stop`); refresh(); }
  catch (e) { alert('停止失败：' + e.message); }
}

async function removeInstance(id) {
  if (!confirm(`确认从列表移除实例 ${id}？（不删除 profile 目录）`)) return;
  try { await api('DELETE', `/api/instances/${encodeURIComponent(id)}`); refresh(); }
  catch (e) { alert('移除失败：' + e.message); }
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
